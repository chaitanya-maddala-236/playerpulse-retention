name: PlayerPulse CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: docker build --file Dockerfile.api --tag playerpulse-api:ci .
      - run: docker build --file Dockerfile.dashboard --tag playerpulse-dashboard:ci .
