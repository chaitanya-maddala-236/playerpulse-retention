[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playerpulse"
version = "0.1.0"
description = "Synthetic-first game retention intelligence portfolio demo"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.14.1",
  "fastapi==0.115.8",
  "joblib==1.4.2",
  "numpy==2.2.2",
  "pandas==2.2.3",
  "psycopg[binary]==3.2.4",
  "pydantic==2.10.6",
  "scikit-learn==1.6.1",
  "sqlalchemy==2.0.38",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dashboard = ["plotly==6.0.0", "streamlit==1.42.0"]
dev = ["httpx==0.28.1", "pytest==8.3.4", "ruff==0.9.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/playerpulse/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
